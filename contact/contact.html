<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact & Feedback</title>

    <link rel="stylesheet" href="contact.css">
</head>

<body>

    <!-- HEADER -->

    <header class="contact-header">

        <h1>Contact & Feedback</h1>

        <p>
            Share your feedback or ask us a question.
        </p>

    </header>


    <!-- CONTACT FORM -->

    <main>

        <section class="contact-section">

            <div class="contact-card">

                <h2>Send Us Your Feedback</h2>

                <p>
                    Your feedback helps us improve this educational project.
                </p>


                <form id="contactForm">

                    <!-- Name -->

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                        >

                        <small id="nameError"></small>

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                        >

                        <small id="emailError"></small>

                    </div>


                    <!-- Service -->

                    <div class="form-group">

                        <label for="service">
                            Service
                        </label>

                        <select id="service">

                            <option value="">
                                Select a service
                            </option>

                            <option value="DigiLocker">
                                DigiLocker
                            </option>

                            <option value="Aadhaar">
                                Aadhaar
                            </option>

                            <option value="PAN">
                                PAN
                            </option>

                        </select>

                        <small id="serviceError"></small>

                    </div>


                    <!-- Message -->

                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            rows="5"
                            placeholder="Write your feedback or question..."
                        ></textarea>

                        <small id="messageError"></small>

                    </div>


                    <!-- Submit -->

                    <button type="submit" class="submit-button">
                        Submit Feedback
                    </button>

                </form>


                <!-- Success Message -->

                <div id="successMessage" class="success-message"></div>


                <!-- Back Home -->

                <a href="../index.html" class="back-button">
                    ← Back to Home
                </a>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Training on DigiLocker, Aadhaar and PAN Services
        </p>

        <p>
            Educational Project
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="contact.js"></script>

</body>

</html>
